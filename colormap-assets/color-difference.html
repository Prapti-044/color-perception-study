<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centered Two Circles</title>
    <script src="../revisitUtilities/revisit-communicate.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        svg {
            display: flex;
        }
    </style>
</head>

<body>
    <svg width="200" height="100">
        <!-- First Circle -->
        <circle cx="40" cy="50" r="30" fill="#000000" />

        <!-- Second Circle -->
        <circle cx="160" cy="50" r="30" fill="#000000" />
    </svg>
</body>
<script>
    // Get data from the config file
    Revisit.onDataReceive((data) => {
        const color1 = data['color1'];
        const color2 = data['color2'];

        document.querySelector('circle[cx="40"]').setAttribute('fill', color1);
        document.querySelector('circle[cx="160"]').setAttribute('fill', color2);
    });
</script>

</html>
